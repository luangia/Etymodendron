name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: Pipeline and dbt tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-warehouse.txt
      - run: pip install -r requirements-warehouse.txt

      # 26 parser/graph tests, plus two synthetic dumps through the loader and a full
      # `dbt build` on duckdb: snapshots, change types and every data test, with no cloud account
      - run: python -m pytest -q

      # the BigQuery target must at least parse (no credentials needed, nothing is queried)
      - name: dbt parse (BigQuery target)
        working-directory: warehouse
        env:
          DBT_TARGET: prod
          GCP_PROJECT: ci-parse-only
        run: dbt parse --profiles-dir .

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
