<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Etymodendron</title>
    <meta name="description" content="English words that share a Proto-Indo-European root, traced through Wiktionary." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3' fill='%23898781'/%3E%3Cg stroke-width='2.5' fill='none' stroke-linecap='round'%3E%3Cpath d='M16 16 C16 9 10 6 6 6' stroke='%232a78d6'/%3E%3Cpath d='M16 16 C23 16 26 10 26 6' stroke='%23eb6834'/%3E%3Cpath d='M16 16 C16 23 22 26 26 26' stroke='%231baf7a'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem("etymodendron-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Etymodendron home">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <circle cx="16" cy="16" r="3" class="brand-dot" />
          <g stroke-width="2.5" fill="none" stroke-linecap="round">
            <path d="M16 16 C16 9 10 6 6 6" class="b-germanic" />
            <path d="M16 16 C23 16 26 10 26 6" class="b-romance" />
            <path d="M16 16 C16 23 22 26 26 26" class="b-greek" />
          </g>
        </svg>
        <span>Etymodendron</span>
      </a>
      <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="search-list" aria-expanded="false">
        <svg class="search-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search an English word…"
          aria-autocomplete="list" aria-controls="search-list" aria-label="Search an English word" disabled />
        <ul id="search-list" role="listbox" hidden></ul>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path class="sun" d="M10 4V2M10 18v-2M4 10H2M18 10h-2M5.8 5.8 4.4 4.4M15.6 15.6l-1.4-1.4M5.8 14.2l-1.4 1.4M15.6 4.4l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle class="sun" cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path class="moon" d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Etymology tree">
        <nav class="crumbs" id="crumbs" aria-label="Path from the root"></nav>
        <div class="controls">
          <div class="legend" id="legend" role="group" aria-label="Branches"></div>
          <label class="toggle"><input type="checkbox" id="affix-toggle" /> <span>Include words formed with an affix</span></label>
        </div>
        <svg id="tree" role="img" aria-label="Radial etymology tree"></svg>
        <div class="zoom-btns">
          <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button class="icon-btn" id="zoom-fit" type="button" aria-label="Fit to screen" title="Fit to screen">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
        </div>
        <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
        <div class="status" id="status" aria-live="polite"></div>
      </section>
      <aside class="panel" id="panel" aria-label="Details">
        <button class="sheet-handle" id="sheet-handle" type="button" aria-label="Expand or collapse details"></button>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
