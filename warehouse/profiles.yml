# Credentials come from the environment; nothing secret lives here.
etymodendron:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:                    # free, on your laptop: python -m etl.warehouse load --backend duckdb
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      schema: main
      threads: 4
    prod:                     # BigQuery; auth is Application Default Credentials (gcloud or the CI action)
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'etymodendron') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 900
